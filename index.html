<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>HabitFlow — Monthly Habit &amp; Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  html.theme-light{
    --bg: #F5F6FC;
    --surface: #FFFFFF;
    --surface-alt: #EEF0FB;
    --surface-raised: #FFFFFF;
    --text: #1B1D2B;
    --text-muted: #6B6F87;
    --text-faint: #9497AC;
    --border: #E4E5F3;
    --border-strong: #D3D5EC;
    --primary: #5B5FEF;
    --primary-dark: #4448C9;
    --primary-soft: #E9E9FD;
    --teal: #21A587;
    --teal-soft: #DEF6EF;
    --amber: #C7860A;
    --amber-soft: #FCEED2;
    --coral: #E14D5A;
    --coral-soft: #FCE3E3;
    --shadow-sm: 0 1px 2px rgba(27,29,43,0.05);
    --shadow-md: 0 16px 36px -16px rgba(27,29,43,0.20);
    --overlay: rgba(20,21,35,0.45);
    --heat-0: #FFFFFF;
    --heat-1: #CDEEE4;
    --heat-2: #8FDCC4;
    --heat-3: #45C39E;
    --heat-4: #1F9A81;
  }
  html.theme-dark{
    --bg: #0E0F17;
    --surface: #171926;
    --surface-alt: #1E2131;
    --surface-raised: #20233486;
    --text: #EDEEF7;
    --text-muted: #9DA0B8;
    --text-faint: #6F728A;
    --border: #2A2D40;
    --border-strong: #363A54;
    --primary: #8285FF;
    --primary-dark: #6669E8;
    --primary-soft: #262A55;
    --teal: #3FD1AE;
    --teal-soft: #123B34;
    --amber: #F0B94D;
    --amber-soft: #3A2E13;
    --coral: #FF8087;
    --coral-soft: #3B2027;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 18px 40px -16px rgba(0,0,0,0.65);
    --overlay: rgba(4,5,12,0.6);
    --heat-0: #2E3248;
    --heat-1: #123B34;
    --heat-2: #1B5A4D;
    --heat-3: #2E9478;
    --heat-4: #3FD1AE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }
  #root{min-height:100vh;}
  h1,h2,h3,.display{font-family:var(--font-display);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--primary-soft);}

  .app-shell{max-width:1320px;margin:0 auto;padding:22px 20px 64px;}

  /* Header */
  .app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:13px;
    background:linear-gradient(145deg, var(--primary), var(--teal));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
    box-shadow: var(--shadow-sm);
  }
  .brand-text h1{font-size:21px;margin:0;font-weight:600;letter-spacing:.2px;}
  .brand-text p{margin:1px 0 0;font-size:12.5px;color:var(--text-muted);}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:17px;transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{background:var(--surface-alt);border-color:var(--border-strong);}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--primary);outline-offset:2px;
  }

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid transparent;
    font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .12s ease, background .15s ease, opacity .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-soft{background:var(--primary-soft);color:var(--primary-dark);}
  .btn-danger{background:var(--coral-soft);color:var(--coral);}
  .btn-danger-solid{background:var(--coral);color:#fff;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px;}
  .btn-block{width:100%;justify-content:center;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Summary + Level */
  .top-grid{display:grid;grid-template-columns:1.15fr 2fr;gap:14px;margin-bottom:14px;}
  .level-card{
    border-radius:var(--radius-lg);
    background:linear-gradient(155deg, var(--primary) 0%, #7B5FEF 55%, var(--teal) 130%);
    color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);
    display:flex;flex-direction:column;justify-content:space-between;min-height:150px;
  }
  .level-card::after{
    content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .level-card::before{
    content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .level-top{display:flex;align-items:baseline;justify-content:space-between;position:relative;z-index:1;}
  .level-num{font-size:38px;font-weight:600;line-height:1;}
  .level-label{font-size:12px;opacity:.85;text-transform:none;}
  .xp-total{font-size:12.5px;opacity:.9;font-weight:500;}
  .xp-track{height:8px;border-radius:99px;background:rgba(255,255,255,0.28);overflow:hidden;margin-top:12px;position:relative;z-index:1;}
  .xp-fill{height:100%;background:#fff;border-radius:99px;transition:width .5s cubic-bezier(.22,.9,.3,1);}
  .xp-caption{font-size:11.5px;opacity:.85;margin-top:6px;position:relative;z-index:1;}

  .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px 15px;box-shadow:var(--shadow-sm);border-left:3px solid var(--stat-accent, var(--primary));
    display:flex;flex-direction:column;gap:3px;
  }
  .stat-label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
  .stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;}
  .stat-sub{font-size:11px;color:var(--text-faint);}

  /* Achievements */
  .achv-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .achv-badge{
    display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-faint);transition:all .2s ease;
  }
  .achv-badge.unlocked{
    background:var(--teal-soft);color:var(--teal);border-color:transparent;box-shadow:var(--shadow-sm);
  }
  .achv-icon{font-size:15px;filter:grayscale(1);opacity:.5;}
  .achv-badge.unlocked .achv-icon{filter:none;opacity:1;}

  /* Main layout */
  .main-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start;margin-bottom:16px;}
  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px;box-shadow:var(--shadow-sm);
  }
  .panel + .panel{margin-top:16px;}
  .main-grid > div{min-width:0;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .panel-title{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:9px;margin:0;letter-spacing:.1px;}
  .panel-title .count-pill{
    background:var(--surface-alt);color:var(--text-muted);font-size:11.5px;font-weight:700;
    padding:2px 8px;border-radius:99px;
  }
  .panel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .search-input{
    padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--text);font-size:13px;min-width:150px;
  }
  .search-input:focus{background:var(--surface);}

  /* Month selector */
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav .month-label{font-family:var(--font-display);font-size:17px;font-weight:600;min-width:150px;text-align:center;}

  /* Tracker table */
  .tracker-scroll{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border);}
  table.tracker{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;}
  table.tracker thead th{
    position:sticky;top:0;background:var(--surface-alt);z-index:2;
    font-size:11px;color:var(--text-muted);font-weight:700;padding:8px 4px;text-align:center;
    border-bottom:1px solid var(--border);
  }
  table.tracker thead th .wd{display:block;font-weight:500;color:var(--text-faint);font-size:9.5px;}
  table.tracker thead th.today-col{background:var(--primary-soft);color:var(--primary-dark);}
  table.tracker td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);}
  table.tracker tr:last-child td{border-bottom:none;}
  .sticky-col{
    position:sticky;left:0;background:var(--surface);z-index:1;text-align:left !important;
    min-width:168px;max-width:168px;padding:8px 10px !important;border-right:1px solid var(--border);
  }
  thead .sticky-col{z-index:3;background:var(--surface-alt);}
  .act-row-main{display:flex;align-items:center;gap:8px;}
  .act-emoji{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;flex-shrink:0;background:var(--act-color-soft, var(--primary-soft));
  }
  .act-name-wrap{min-width:0;flex:1;}
  .act-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .act-pct{font-size:10.5px;color:var(--text-faint);}
  .act-row-tools{display:none;gap:2px;flex-shrink:0;}
  tr:hover .act-row-tools, tr:focus-within .act-row-tools{display:flex;}
  .mini-icon-btn{
    width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;
  }
  .mini-icon-btn:hover{background:var(--surface-alt);color:var(--text);}

  .chk{
    width:24px;height:24px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .chk:hover{border-color:var(--primary);transform:translateY(-1px);}
  .chk.checked{background:var(--chk-color, var(--teal));border-color:transparent;}
  .chk.checked:active, .chk:active{transform:scale(.88);}
  .today-cell{background:var(--primary-soft);}

  .dayall-btn{
    width:18px;height:18px;border-radius:5px;border:1px dashed var(--border-strong);background:transparent;
    color:var(--text-faint);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    margin:0 auto 3px;
  }
  .dayall-btn:hover{border-color:var(--primary);color:var(--primary);}

  /* progress bars */
  .pbar{height:9px;border-radius:99px;background:var(--surface-alt);overflow:hidden;}
  .pbar > div{height:100%;border-radius:99px;background:var(--primary);transition:width .5s cubic-bezier(.22,.9,.3,1);}
  .month-progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12.5px;color:var(--text-muted);}
  .month-progress-row strong{color:var(--text);font-family:var(--font-display);font-size:15px;}

  /* Charts */
  .charts-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
  @media (max-width:860px){.charts-grid{grid-template-columns:1fr;}}
  .weekly-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px;}
  .wk-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .wk-bar{
    width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg, var(--teal), var(--primary));
    transition:height .5s cubic-bezier(.22,.9,.3,1);min-height:4px;
  }
  .wk-bar-label{font-size:10.5px;color:var(--text-faint);}
  .wk-bar-wrap.is-today .wk-bar-label{color:var(--primary);font-weight:700;}

  .cat-row{margin-bottom:11px;}
  .cat-row:last-child{margin-bottom:0;}
  .cat-row-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .cat-row-top .cname{font-weight:600;}
  .cat-row-top .cfrac{color:var(--text-faint);}

  /* Tasks */
  .filter-tabs{display:flex;gap:4px;background:var(--surface-alt);padding:3px;border-radius:10px;}
  .filter-tab{
    border:none;background:transparent;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;
    color:var(--text-muted);cursor:pointer;
  }
  .filter-tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm);}
  .sort-select{
    border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;
    padding:6px 8px;font-size:12px;
  }

  .task-progress{display:flex;align-items:center;gap:10px;margin:12px 0 16px;}
  .task-progress .pbar{flex:1;}
  .task-progress-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}

  .task-list{display:flex;flex-direction:column;gap:9px;max-height:520px;overflow-y:auto;padding-right:2px;}
  .task-item{
    border:1px solid var(--border);border-left:3px solid var(--prio-color, var(--border));border-radius:var(--radius-sm);
    padding:11px 12px;display:flex;gap:10px;background:var(--surface);transition:opacity .2s ease, background .2s ease;
    position:relative;
  }
  .task-item.completed{opacity:.55;}
  .task-item.overdue{background:var(--coral-soft);}
  .task-check{
    width:21px;height:21px;border-radius:7px;border:1.5px solid var(--border-strong);background:var(--surface);
    flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;
  }
  .task-check.checked{background:var(--teal);border-color:transparent;}
  .task-body{flex:1;min-width:0;}
  .task-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .task-title{font-size:13.5px;font-weight:600;}
  .task-item.completed .task-title{text-decoration:line-through;}
  .task-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
  .tag-prio-High{background:var(--coral-soft);color:var(--coral);}
  .tag-prio-Medium{background:var(--amber-soft);color:var(--amber);}
  .tag-prio-Low{background:var(--teal-soft);color:var(--teal);}
  .tag-due{background:var(--surface-alt);color:var(--text-muted);}
  .tag-due.is-overdue{background:var(--coral);color:#fff;}
  .tag-cat{background:var(--primary-soft);color:var(--primary-dark);}
  .task-tools{display:flex;gap:2px;flex-shrink:0;}
  .empty-state{text-align:center;padding:38px 12px;color:var(--text-muted);}
  .empty-state .es-emoji{font-size:34px;display:block;margin-bottom:8px;}
  .empty-state p{margin:2px 0;font-size:13px;}

  /* Modals */
  .modal-overlay{
    position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:100;
  }
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-md);max-height:88vh;overflow-y:auto;
  }
  .modal.modal-wide{max-width:640px;}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:600;}
  .modal .modal-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}
  .form-group{margin-bottom:13px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .form-row{display:flex;gap:10px;}
  .form-row .form-group{flex:1;}
  .form-control{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--text);font-size:13.5px;
  }
  .form-control:focus{background:var(--surface);border-color:var(--primary);}
  textarea.form-control{resize:vertical;min-height:64px;}
  .field-error{color:var(--coral);font-size:11.5px;margin-top:4px;}
  .icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
  .icon-swatch{
    width:100%;aspect-ratio:1;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-alt);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .icon-swatch.selected{border-color:var(--primary);background:var(--primary-soft);}
  .color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
  .color-swatch{
    width:100%;aspect-ratio:1;border-radius:99px;border:2px solid transparent;cursor:pointer;position:relative;
  }
  .color-swatch.selected{border-color:var(--text);}
  .color-swatch.selected::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;}
  .modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end;}

  .settings-section{margin-bottom:18px;}
  .settings-section h4{font-size:12.5px;text-transform:none;color:var(--text-muted);margin:0 0 9px;font-weight:700;}
  .theme-toggle-row{display:flex;gap:8px;}
  .theme-opt{
    flex:1;padding:10px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-alt);
    cursor:pointer;font-size:12.5px;font-weight:600;text-align:center;
  }
  .theme-opt.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);}
  .settings-btn-row{display:flex;flex-direction:column;gap:8px;}
  input[type=file]{display:none;}

  /* Toasts */
  .toast-stack{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:9px;z-index:200;max-width:300px;}
  .toast{
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);
    border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-md);
    animation:toastIn .25s ease;
  }
  .toast.achievement{border-left-color:var(--amber);}
  .toast.error{border-left-color:var(--coral);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* Confetti */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
  .confetti-piece{position:absolute;top:-12px;width:8px;height:12px;opacity:.9;animation:confettiFall linear forwards;}
  @keyframes confettiFall{to{transform:translateY(105vh) rotate(560deg);opacity:.3;}}

  /* Year in Review */
  .year-panel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .year-nav{display:flex;align-items:center;gap:10px;}
  .year-nav .year-label{font-family:var(--font-display);font-size:17px;font-weight:600;min-width:56px;text-align:center;}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ---------------- constants ---------------- */
const STORAGE_KEY = 'habitflow_data_v2';
const WEEKDAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const DEFAULT_ACTIVITIES = [
  {id:'exercise', name:'Exercise', icon:'💪', color:'#5B5FEF'},
  {id:'study', name:'Study', icon:'📚', color:'#21A587'},
  {id:'coding', name:'Coding', icon:'💻', color:'#C7860A'},
  {id:'reading', name:'Reading', icon:'📖', color:'#8A5FEF'},
  {id:'meditation', name:'Meditation', icon:'🧘', color:'#3FBFA6'},
  {id:'sleep', name:'Sleep', icon:'🌙', color:'#6C7BD9'},
  {id:'water', name:'Water', icon:'💧', color:'#4E9CE0'},
  {id:'personal', name:'Personal', icon:'✅', color:'#E1685F'},
];

const ICON_OPTIONS = ['💪','📚','💻','📖','🧘','🌙','💧','✅','🎯','🎨','🎵','🏃','🍎','✍️','🧠','🌱','⏰','🎓','🧹','💰','🚴','🥗','🧴','📷'];
const COLOR_OPTIONS = ['#5B5FEF','#21A587','#C7860A','#8A5FEF','#3FBFA6','#6C7BD9','#4E9CE0','#E1685F','#E0629A','#1FA8B8','#7BB026','#C74FA0'];
const DEFAULT_CATEGORIES = ['Study','Coding','Personal','Health','Work'];
const ACHIEVEMENT_META = {
  firstStep: {label:'First Step', desc:'Complete your first activity', icon:'🌱'},
  sevenDayStreak: {label:'7-Day Streak', desc:'Keep any streak going for 7 days', icon:'🔥'},
  consistentLearner: {label:'Consistent Learner', desc:'Complete Study for 7 days straight', icon:'📚'},
  monthlyChampion: {label:'Monthly Champion', desc:'Hit 80% completion in a month', icon:'🏆'},
};

/* ---------------- date helpers ---------------- */
function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function toKey(y, m){ return y + '-' + pad2(m+1); } // m is 0-indexed
function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
function fmtDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function monthKeyOfDate(d){ return toKey(d.getFullYear(), d.getMonth()); }
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function genId(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------------- data helpers ---------------- */
function isDayChecked(monthlyData, monthKey, activityId, day){
  return !!(monthlyData[monthKey] && monthlyData[monthKey][activityId] && monthlyData[monthKey][activityId][day]);
}
function isAnyCheckedOnDate(monthlyData, dateObj){
  const mk = monthKeyOfDate(dateObj);
  const monthObj = monthlyData[mk];
  if(!monthObj) return false;
  const day = dateObj.getDate();
  return Object.keys(monthObj).some(actId => !!(monthObj[actId] && monthObj[actId][day]));
}
function isActivityCheckedOnDate(monthlyData, activityId, dateObj){
  const mk = monthKeyOfDate(dateObj);
  const monthObj = monthlyData[mk];
  if(!monthObj || !monthObj[activityId]) return false;
  return !!monthObj[activityId][dateObj.getDate()];
}
function computeMonthStats(monthlyData, monthKey, activities, days){
  let checked = 0;
  const possible = activities.length * days;
  activities.forEach(act => {
    for(let d=1; d<=days; d++){
      if(isDayChecked(monthlyData, monthKey, act.id, d)) checked++;
    }
  });
  return {checked, possible, percent: possible ? Math.round((checked/possible)*100) : 0};
}
function computeActivityStats(monthlyData, monthKey, activityId, days){
  let checked = 0;
  for(let d=1; d<=days; d++){ if(isDayChecked(monthlyData, monthKey, activityId, d)) checked++; }
  return {checked, percent: days ? Math.round((checked/days)*100) : 0};
}
function computeXP(data){
  let habitXP = 0;
  Object.values(data.monthlyData).forEach(monthObj => {
    Object.values(monthObj).forEach(actObj => {
      Object.values(actObj).forEach(v => { if(v) habitXP += 10; });
    });
  });
  const taskXP = data.tasks.filter(t => t.completed).length * 20;
  return habitXP + taskXP;
}
function computeLevel(xp){
  const level = Math.floor(xp/100) + 1;
  const into = xp % 100;
  return {level, into, need:100};
}
function computeCurrentStreak(monthlyData){
  let cursor = new Date();
  if(!isAnyCheckedOnDate(monthlyData, cursor)){
    cursor = addDays(cursor, -1);
  }
  let streak = 0;
  for(let i=0;i<3650;i++){
    if(isAnyCheckedOnDate(monthlyData, cursor)){
      streak++;
      cursor = addDays(cursor, -1);
    } else break;
  }
  return streak;
}
function computeActivityStreak(monthlyData, activityId){
  let cursor = new Date();
  if(!isActivityCheckedOnDate(monthlyData, activityId, cursor)){
    cursor = addDays(cursor, -1);
  }
  let streak = 0;
  for(let i=0;i<3650;i++){
    if(isActivityCheckedOnDate(monthlyData, activityId, cursor)){
      streak++;
      cursor = addDays(cursor, -1);
    } else break;
  }
  return streak;
}

/* ---------------- sample data ---------------- */
function buildSampleData(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const mk = toKey(y, m);
  const today = now.getDate();
  const monthObj = {};
  DEFAULT_ACTIVITIES.forEach((act, idx) => {
    const dayMap = {};
    for(let d=1; d<=today; d++){
      dayMap[d] = ((d + idx) % 3 !== 0);
    }
    monthObj[act.id] = dayMap;
  });
  const tasks = [
    {id:genId('t'), title:'Finish literature review draft', description:'Chapter 2 draft for Prof. Lee', priority:'High', dueDate: todayStr(), category:'Study', completed:false, createdAt:Date.now()},
    {id:genId('t'), title:'Submit lab report', description:'Physics 201 lab writeup', priority:'Medium', dueDate: fmtDate(addDays(now,-2)), category:'Coursework', completed:false, createdAt:Date.now()},
    {id:genId('t'), title:'Grocery run', description:'Milk, eggs, coffee', priority:'Low', dueDate: todayStr(), category:'Personal', completed:true, createdAt:Date.now()},
    {id:genId('t'), title:'Review teammate\'s pull request', description:'Check the auth module changes', priority:'Medium', dueDate: fmtDate(addDays(now,1)), category:'Coding', completed:false, createdAt:Date.now()},
  ];
  return {
    activities: DEFAULT_ACTIVITIES.map(a => ({...a})),
    monthlyData: {[mk]: monthObj},
    tasks,
    settings: {theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light', seeded:true},
    achievements: {firstStep:false, sevenDayStreak:false, consistentLearner:false, monthlyChampion:false},
    bestStreak: 0,
  };
}
function emptyData(theme){
  return {
    activities: DEFAULT_ACTIVITIES.map(a => ({...a})),
    monthlyData: {},
    tasks: [],
    settings: {theme: theme || 'light', seeded:true},
    achievements: {firstStep:false, sevenDayStreak:false, consistentLearner:false, monthlyChampion:false},
    bestStreak: 0,
  };
}
function mergeLoaded(parsed){
  const base = emptyData();
  return {
    activities: Array.isArray(parsed.activities) && parsed.activities.length ? parsed.activities : base.activities,
    monthlyData: parsed.monthlyData && typeof parsed.monthlyData === 'object' ? parsed.monthlyData : {},
    tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
    settings: {...base.settings, ...(parsed.settings||{})},
    achievements: {...base.achievements, ...(parsed.achievements||{})},
    bestStreak: typeof parsed.bestStreak === 'number' ? parsed.bestStreak : 0,
  };
}
function loadInitialData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return mergeLoaded(parsed);
    }
  }catch(e){ /* fall through to fresh sample data */ }
  return buildSampleData();
}

          <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
          <button className={danger ? "btn btn-danger-solid" : "btn btn-primary"} onClick={onConfirm}>{confirmLabel || 'Confirm'}</button>
        </div>

}

function ProgressBar({percent, color}){

/* ---------------- Activity Modal ---------------- */
function ActivityModal({initial, existingNames, onSave, onClose}){
  const [name, setName] = useState(initial ? initial.name : '');
  const [icon, setIcon] = useState(initial ? initial.icon : ICON_OPTIONS[0]);
  const [color, setColor] = useState(initial ? initial.color : COLOR_OPTIONS[0]);
  const [error, setError] = useState('');

  function handleSave(){
    const trimmed = name.trim();
    if(!trimmed){ setError('Activity name cannot be empty.'); return; }
    const dup = existingNames.some(n => n.toLowerCase() === trimmed.toLowerCase() && (!initial || n.toLowerCase() !== initial.name.toLowerCase()));
    if(dup){ setError('An activity with this name already exists.'); return; }
    onSave({name:trimmed, icon, color});
  }

  return (
    <div className="modal-overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <h3>{initial ? 'Edit activity' : 'Add activity'}</h3>
        <p className="modal-sub">Track something new every day of the month.</p>
        <div className="form-group">
          <label>Activity name</label>
          <input className="form-control" value={name} onChange={e=>{setName(e.target.value); setError('');}} placeholder="e.g. Journaling" maxLength={30} autoFocus />
          {error && <div className="field-error">{error}</div>}
        </div>
        <div className="form-group">
          <label>Icon</label>
          <div className="icon-grid">
            {ICON_OPTIONS.map(ic => (
              <button type="button" key={ic} className={"icon-swatch" + (ic===icon ? ' selected' : '')} onClick={()=>setIcon(ic)}>{ic}</button>
            ))}
          </div>
        </div>
        <div className="form-group">
          <label>Color</label>
          <div className="color-grid">
            {COLOR_OPTIONS.map(c => (
              <button type="button" key={c} className={"color-swatch" + (c===color ? ' selected' : '')} style={{background:c}} onClick={()=>setColor(c)}></button>
            ))}
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>{initial ? 'Save changes' : 'Add activity'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Task Modal ---------------- */

/* ---------------- Confetti ---------------- */
function Confetti({burstId}){
  const [pieces, setPieces] = useState([]);
  useEffect(()=>{
    if(!burstId) return;
    const colors = ['#5B5FEF','#21A587','#C7860A','#E1685F','#8A5FEF'];
    const arr = Array.from({length:36}).map((_,i)=>({
      id: i+'-'+burstId,
      left: Math.random()*100,
      delay: Math.random()*0.3,
      duration: 1.6 + Math.random()*1.1,
      color: colors[i % colors.length],
      rotate: Math.random()*360,
    }));
    setPieces(arr);
    const t = setTimeout(()=> setPieces([]), 3000);
    return ()=> clearTimeout(t);
  }, [burstId]);
  if(!pieces.length) return null;
  return (
    <div className="confetti-layer">
      {pieces.map(p => (
        <span key={p.id} className="confetti-piece" style={{
          left:p.left+'%', background:p.color,
          animationDuration:p.duration+'s', animationDelay:p.delay+'s',
          transform:'rotate('+p.rotate+'deg)'
        }}></span>
      ))}
    </div>
  );
}

/* ---------------- Year in Review ---------------- */
function heatColor(pct){
  if(pct<=0) return 'var(--heat-0)';
  if(pct<=0.25) return 'var(--heat-1)';
  if(pct<=0.5) return 'var(--heat-2)';
  if(pct<=0.75) return 'var(--heat-3)';
  return 'var(--heat-4)';
}

function MiniMonthHeat({year, monthIndex, monthlyData, activities, isCurrent}){
  const dim = daysInMonth(year, monthIndex);
  const mk = toKey(year, monthIndex);
  const firstWeekday = new Date(year, monthIndex, 1).getDay();
  const stats = computeMonthStats(monthlyData, mk, activities, dim);
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=dim; d++){
    const checked = activities.length ? activities.filter(a => isDayChecked(monthlyData, mk, a.id, d)).length : 0;
    const pct = activities.length ? checked/activities.length : 0;
    cells.push({d, pct});
  }
  return (
    <div className={"mini-month" + (isCurrent ? ' is-current' : '')}>
      <div className="mini-month-head">
        <span className="mini-month-name">{MONTH_NAMES[monthIndex].slice(0,3)}</span>
        <span className="mini-month-pct">{stats.possible ? stats.percent + '%' : '—'}</span>
      </div>
      <div className="mini-month-grid">
        {cells.map((c,i) => c ? (
          <div key={i} className="mini-day" style={{background: heatColor(c.pct)}} title={MONTH_NAMES[monthIndex] + ' ' + c.d + ', ' + year + ' · ' + Math.round(c.pct*100) + '%'}></div>
        ) : <div key={i} className="mini-day mini-day-empty"></div>)}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){

  const [activityModal, setActivityModal] = useState(null); // {mode:'add'|'edit', activity}
  const [taskModal, setTaskModal] = useState(null); // {mode, task}
  const [moveTaskTarget, setMoveTaskTarget] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [confirmState, setConfirmState] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [confettiBurst, setConfettiBurst] = useState(0);

  /* theme application */
  useEffect(()=>{
    document.documentElement.className = 'theme-' + (data.settings.theme || 'light');
  }, [data.settings.theme]);

  /* persist */
  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){ /* storage full or unavailable */ }
  }, [data]);

  const pushToast = useCallback((message, type)=>{
    const id = genId('toast');
    setToasts(prev => [...prev, {id, message, type: type||'default'}]);
    setTimeout(()=> setToasts(prev => prev.filter(t => t.id!==id)), 3200);
  }, []);

  /* achievement evaluation */
  useEffect(()=>{
    const streak = computeCurrentStreak(data.monthlyData);
    const studyStreak = data.activities.some(a=>a.id==='study') ? computeActivityStreak(data.monthlyData, 'study') : 0;
    const anyChecked = Object.values(data.monthlyData).some(mo => Object.values(mo).some(ao => Object.values(ao).some(v=>v)));
    const anyMonthChampion = Object.keys(data.monthlyData).some(mk => {
      const [y,m] = mk.split('-').map(Number);
      const days = daysInMonth(y, m-1);
      return computeMonthStats(data.monthlyData, mk, data.activities, days).percent >= 80;
    });
    const prev = data.achievements;
    const next = {
      firstStep: prev.firstStep || anyChecked,
      sevenDayStreak: prev.sevenDayStreak || streak >= 7,
      consistentLearner: prev.consistentLearner || studyStreak >= 7,
      monthlyChampion: prev.monthlyChampion || anyMonthChampion,
    };
    const bestStreak = Math.max(data.bestStreak||0, streak);
    const changedAchievements = Object.keys(next).some(k => next[k] !== prev[k]);
    const changedBest = bestStreak !== data.bestStreak;
    if(changedAchievements || changedBest){
      setData(d => ({...d, achievements: next, bestStreak}));
    }
    if(changedAchievements){
      const newlyUnlocked = Object.keys(next).filter(k => next[k] && !prev[k]);
      if(newlyUnlocked.length){
        newlyUnlocked.forEach(k => pushToast('🎉 Achievement unlocked: ' + ACHIEVEMENT_META[k].label, 'achievement'));
        setConfettiBurst(b => b+1);
      }
    }
    // eslint-disable-next-line
  }, [data.monthlyData, data.tasks]);

  /* ---------- derived values ---------- */
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthKey = toKey(year, month);
  const days = daysInMonth(year, month);
  const dayArr = useMemo(()=> Array.from({length:days}, (_,i)=>i+1), [days]);
  const isCurrentActualMonth = monthKeyOfDate(new Date()) === monthKey;
  const todayNum = new Date().getDate();

  const monthStats = useMemo(()=> computeMonthStats(data.monthlyData, monthKey, data.activities, days), [data.monthlyData, monthKey, data.activities, days]);
  const xp = useMemo(()=> computeXP(data), [data]);
  const levelInfo = useMemo(()=> computeLevel(xp), [xp]);
  const currentStreak = useMemo(()=> computeCurrentStreak(data.monthlyData), [data.monthlyData]);

  const reviewYear = year;
  const yearStats = useMemo(()=>{
    const now = new Date();
    const isThisYear = now.getFullYear() === reviewYear;
    const monthsToCount = isThisYear ? now.getMonth()+1 : 12;
    let checkedSum = 0, possibleSum = 0, activeDays = 0, bestPct = -1, bestMonthName = '—';
    for(let m=0; m<monthsToCount; m++){
      const mk = toKey(reviewYear, m);
      const dim = daysInMonth(reviewYear, m);
      const ms = computeMonthStats(data.monthlyData, mk, data.activities, dim);
      checkedSum += ms.checked; possibleSum += ms.possible;
      if(ms.possible > 0 && ms.percent > bestPct){ bestPct = ms.percent; bestMonthName = MONTH_NAMES[m].slice(0,3) + ' (' + ms.percent + '%)'; }
      for(let d=1; d<=dim; d++){
        if(data.activities.some(a => isDayChecked(data.monthlyData, mk, a.id, d))) activeDays++;
      }
    }
    return {
      activeDays,
      avgPercent: possibleSum ? Math.round((checkedSum/possibleSum)*100) : 0,
      bestMonthName,
    };
  }, [data.monthlyData, data.activities, reviewYear]);

  const todayMonthKey = monthKeyOfDate(new Date());
  const todayDayNum = new Date().getDate();
  const todaysActivitiesTotal = data.activities.length;
  const todaysChecked = data.activities.filter(a => isDayChecked(data.monthlyData, todayMonthKey, a.id, todayDayNum)).length;
  const todayPercent = todaysActivitiesTotal ? Math.round((todaysChecked/todaysActivitiesTotal)*100) : 0;

  const totalTasks = data.tasks.length;
  const completedTasks = data.tasks.filter(t=>t.completed).length;
  const pendingTasks = totalTasks - completedTasks;

  const filteredActivities = useMemo(()=>{
    const q = activitySearch.trim().toLowerCase();
    if(!q) return data.activities;
    return data.activities.filter(a => a.name.toLowerCase().includes(q));
  }, [data.activities, activitySearch]);

  const categories = useMemo(()=>{
    const set = new Set(DEFAULT_CATEGORIES);
    data.tasks.forEach(t => { if(t.category) set.add(t.category); });
    return Array.from(set);
  }, [data.tasks]);

  const filteredSortedTasks = useMemo(()=>{
    const todayS = todayStr();
    let list = data.tasks.filter(t => {
      if(taskFilter === 'Pending') return !t.completed;
      if(taskFilter === 'Completed') return t.completed;
      if(taskFilter === 'Overdue') return !t.completed && t.dueDate < todayS;
      return true;
    });
    const q = taskSearch.trim().toLowerCase();
    if(q){
      list = list.filter(t =>
        t.title.toLowerCase().includes(q) ||
        (t.description||'').toLowerCase().includes(q) ||
        (t.category||'').toLowerCase().includes(q)
      );
    }
    const prioRank = {High:0, Medium:1, Low:2};
    list = [...list].sort((a,b)=>{
      if(a.completed !== b.completed) return a.completed ? 1 : -1;
      if(taskSort === 'priority') return prioRank[a.priority] - prioRank[b.priority];
      return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    });
    return list;
  }, [data.tasks, taskFilter, taskSearch, taskSort]);

  const todayTasksOnly = useMemo(()=> data.tasks.filter(t => t.dueDate === todayStr()), [data.tasks]);
  const taskProgressPercent = useMemo(()=>{
    const base = todayTasksOnly.length ? todayTasksOnly : data.tasks;
    if(!base.length) return 0;
    return Math.round((base.filter(t=>t.completed).length/base.length)*100);
  }, [todayTasksOnly, data.tasks]);

  const weeklyChartData = useMemo(()=>{
    const arr = [];
    for(let i=6;i>=0;i--){
      const d = addDays(new Date(), -i);
      const checked = data.activities.filter(a => isActivityCheckedOnDate(data.monthlyData, a.id, d)).length;
      const pct = data.activities.length ? Math.round((checked/data.activities.length)*100) : 0;
      arr.push({label: WEEKDAY_SHORT[d.getDay()], pct, isToday: i===0});
    }
    return arr;
  }, [data.monthlyData, data.activities]);

  const categoryChartData = useMemo(()=>{
    const map = {};
    data.tasks.forEach(t => {
      const cat = t.category || 'General';
      if(!map[cat]) map[cat] = {total:0, completed:0};
      map[cat].total++;
      if(t.completed) map[cat].completed++;
    });
    return Object.keys(map).map((cat,i) => ({
      name:cat, total:map[cat].total, completed:map[cat].completed,
      percent: Math.round((map[cat].completed/map[cat].total)*100),
      color: COLOR_OPTIONS[i % COLOR_OPTIONS.length],
    })).sort((a,b)=> b.total-a.total).slice(0,6);
  }, [data.tasks]);

  /* ---------- actions ---------- */
  function toggleDay(activityId, day){
    setData(prev => {
      const md = {...prev.monthlyData};
      const monthObj = {...(md[monthKey]||{})};
      const actObj = {...(monthObj[activityId]||{})};
      actObj[day] = !actObj[day];
      monthObj[activityId] = actObj;
      md[monthKey] = monthObj;
      return {...prev, monthlyData: md};
    });
  }

  function toggleWholeDay(day){
    setData(prev => {
      const md = {...prev.monthlyData};
      const monthObj = {...(md[monthKey]||{})};
      const allChecked = prev.activities.every(a => monthObj[a.id] && monthObj[a.id][day]);
      prev.activities.forEach(a => {
        const actObj = {...(monthObj[a.id]||{})};
        actObj[day] = !allChecked;
        monthObj[a.id] = actObj;
      });
      md[monthKey] = monthObj;
      return {...prev, monthlyData: md};
    });
  }

  function goPrevMonth(){ setViewDate(d => new Date(d.getFullYear(), d.getMonth()-1, 1)); }
  function goNextMonth(){ setViewDate(d => new Date(d.getFullYear(), d.getMonth()+1, 1)); }
  function goToday(){ setViewDate(new Date()); }
  function goPrevYear(){ setViewDate(d => new Date(d.getFullYear()-1, d.getMonth(), 1)); }
  function goNextYear(){ setViewDate(d => new Date(d.getFullYear()+1, d.getMonth(), 1)); }

  function saveActivity(payload){
    if(activityModal.mode === 'edit'){
      setData(prev => ({...prev, activities: prev.activities.map(a => a.id===activityModal.activity.id ? {...a, ...payload} : a)}));
    } else {
      setData(prev => ({...prev, activities: [...prev.activities, {id:genId('act'), ...payload}]}));
    }
    setActivityModal(null);
  }

  function requestDeleteActivity(activity){
    setConfirmState({
      title:'Delete activity?',
      message:'"'+activity.name+'" and all of its tracked history will be permanently removed.',
      confirmLabel:'Delete', danger:true,
      onConfirm: ()=>{
        setData(prev => ({...prev, activities: prev.activities.filter(a=>a.id!==activity.id)}));
        setConfirmState(null);
      }
    });
  }

  function requestResetMonth(){
    setConfirmState({
      title:'Reset this month?',
      message:'All checkboxes for ' + MONTH_NAMES[month] + ' ' + year + ' will be cleared. This cannot be undone.',
      confirmLabel:'Reset month', danger:true,
      onConfirm: ()=>{
        setData(prev => { const md = {...prev.monthlyData}; delete md[monthKey]; return {...prev, monthlyData: md}; });
        setConfirmState(null);
      }
    });
  }

  function saveTask(payload){
    if(taskModal.mode === 'edit'){
      setData(prev => ({...prev, tasks: prev.tasks.map(t => t.id===taskModal.task.id ? {...t, ...payload} : t)}));
    } else {
      setData(prev => ({...prev, tasks:[...prev.tasks, {id:genId('t'), completed:false, createdAt:Date.now(), ...payload}]}));
    }
    setTaskModal(null);
  }

  function toggleTask(taskId){
    setData(prev => ({...prev, tasks: prev.tasks.map(t => t.id===taskId ? {...t, completed:!t.completed} : t)}));
  }

  function requestDeleteTask(task){
    setConfirmState({
      title:'Delete task?',
      message:'"'+task.title+'" will be permanently removed.',
      confirmLabel:'Delete', danger:true,
      onConfirm: ()=>{
        setData(prev => ({...prev, tasks: prev.tasks.filter(t=>t.id!==task.id)}));
        setConfirmState(null);
      }
    });
  }

  function requestClearCompleted(){
    const n = data.tasks.filter(t=>t.completed).length;
    if(!n){ pushToast('No completed tasks to clear.'); return; }
    setConfirmState({
      title:'Clear completed tasks?',
      message: n + ' completed task' + (n===1?'':'s') + ' will be removed.',
      confirmLabel:'Clear', danger:true,
      onConfirm: ()=>{
        setData(prev => ({...prev, tasks: prev.tasks.filter(t=>!t.completed)}));
        setConfirmState(null);
      }
    });
  }

  function moveTask(newDate){
    setData(prev => ({...prev, tasks: prev.tasks.map(t => t.id===moveTaskTarget.id ? {...t, dueDate:newDate} : t)}));
    pushToast('Task moved to ' + newDate);
    setMoveTaskTarget(null);
  }

  function setTheme(theme){ setData(prev => ({...prev, settings:{...prev.settings, theme}})); }

  function exportData(){
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'habitflow-export-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    pushToast('Data exported.');
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('bad');
        setConfirmState({
          title:'Import data?',
          message:'This will replace your current activities, tracker history, and tasks with the imported file.',
          confirmLabel:'Import', danger:true,
          onConfirm: ()=>{
            setData(mergeLoaded(parsed));
            setConfirmState(null);
            setSettingsOpen(false);
            pushToast('Data imported successfully.');
          }
        });
      }catch(e){
        pushToast('That file could not be read as valid backup data.', 'error');
      }
    };
    reader.readAsText(file);
  }

  function requestResetSample(){
    setConfirmState({
      title:'Restore sample data?',
      message:'This replaces your current data with the original demo activities and tasks.',
      confirmLabel:'Restore', danger:true,
      onConfirm: ()=>{
        const sample = buildSampleData();
        sample.settings.theme = data.settings.theme;
        setData(sample);
        setConfirmState(null);
        setSettingsOpen(false);
        pushToast('Sample data restored.');
      }
    });
  }

  function requestClearAll(){
    setConfirmState({
      title:'Clear ALL data?',
      message:'This permanently deletes every activity, checkbox, task, and achievement. This action cannot be undone.',
      confirmLabel:'Clear everything', danger:true,
      onConfirm: ()=>{
        setData(emptyData(data.settings.theme));
        setConfirmState(null);
        setSettingsOpen(false);
        pushToast('All data cleared.');
      }
    });
  }

  /* ---------- render ---------- */
  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="brand">
          <div className="brand-mark">🌿</div>
          <div className="brand-text">
            <h1>HabitFlow</h1>
            <p>Your monthly habits &amp; daily tasks, in one place</p>
          </div>
        </div>
        <div className="header-actions">
          <button className="icon-btn" title="Toggle theme" onClick={()=>setTheme(data.settings.theme==='dark'?'light':'dark')}>
            {data.settings.theme==='dark' ? '☀️' : '🌙'}
          </button>
          <button className="icon-btn" title="Settings" onClick={()=>setSettingsOpen(true)}>⚙️</button>
        </div>
      </header>

      <div className="top-grid">
        <div className="level-card">
          <div className="level-top">
            <div>
              <div className="level-label">Level</div>
              <div className="level-num">{levelInfo.level}</div>
            </div>
            <div className="xp-total">{xp} XP total</div>
          </div>
          <div>
            <div className="xp-track"><div className="xp-fill" style={{width:levelInfo.into+'%'}}></div></div>
            <div className="xp-caption">{levelInfo.into} / {levelInfo.need} XP to level {levelInfo.level+1}</div>
          </div>
        </div>

        <div className="summary-grid">
          <div className="stat-card" style={{'--stat-accent':'var(--primary)'}}>
            <div className="stat-label">Today</div>
            <div className="stat-value">{todayPercent}%</div>
            <div className="stat-sub">{todaysChecked}/{todaysActivitiesTotal} habits done</div>
          </div>
          <div className="stat-card" style={{'--stat-accent':'var(--teal)'}}>
            <div className="stat-label">This month</div>
            <div className="stat-value">{monthStats.percent}%</div>
            <div className="stat-sub">{monthStats.checked}/{monthStats.possible} checked</div>
          </div>
          <div className="stat-card" style={{'--stat-accent':'var(--amber)'}}>
            <div className="stat-label">Tasks done</div>
            <div className="stat-value">{completedTasks}</div>
            <div className="stat-sub">{pendingTasks} pending</div>
          </div>
          <div className="stat-card" style={{'--stat-accent':'var(--coral)'}}>
            <div className="stat-label">Current streak</div>
            <div className="stat-value">{currentStreak}d</div>
            <div className="stat-sub">Keep it alive</div>
          </div>
          <div className="stat-card" style={{'--stat-accent':'#8A5FEF'}}>
            <div className="stat-label">Best streak</div>
            <div className="stat-value">{data.bestStreak||0}d</div>
            <div className="stat-sub">Personal record</div>
          </div>
        </div>
      </div>

      <div className="achv-row">
        {Object.keys(ACHIEVEMENT_META).map(key => {
          const meta = ACHIEVEMENT_META[key];
          const unlocked = data.achievements[key];
          return (
            <div key={key} className={"achv-badge" + (unlocked ? ' unlocked' : '')} title={meta.desc}>
              <span className="achv-icon">{meta.icon}</span>{meta.label}
            </div>
          );
        })}
      </div>

      <div className="main-grid">
        <div>
          <div className="panel">
            <div className="panel-header">
              <h2 className="panel-title">🗓️ Habit tracker</h2>
              <div className="panel-actions">
                <input className="search-input" placeholder="Search activities" value={activitySearch} onChange={e=>setActivitySearch(e.target.value)} />
                <button className="btn btn-ghost btn-sm" onClick={requestResetMonth}>Reset month</button>
                <button className="btn btn-primary btn-sm" onClick={()=>setActivityModal({mode:'add'})}>+ Add activity</button>
              </div>
            </div>

            <div className="month-nav" style={{justifyContent:'center', marginBottom:14}}>
              <button className="icon-btn" onClick={goPrevMonth} title="Previous month">←</button>
              <div className="month-label">{MONTH_NAMES[month]} {year}</div>
              <button className="icon-btn" onClick={goNextMonth} title="Next month">→</button>
              {!isCurrentActualMonth && <button className="btn btn-ghost btn-sm" onClick={goToday}>Today</button>}
            </div>

            <div className="tracker-scroll">
              <table className="tracker">
                <thead>
                  <tr>
                    <th className="sticky-col">Activity</th>
                    {dayArr.map(d => {
                      const dt = new Date(year, month, d);
                      const isToday = isCurrentActualMonth && d===todayNum;
                      return (
                        <th key={d} className={isToday ? 'today-col' : ''}>
                          <button className="dayall-btn" title="Toggle all activities for this day" onClick={()=>toggleWholeDay(d)}>✓</button>
                          {d}
                          <span className="wd">{WEEKDAY_SHORT[dt.getDay()]}</span>
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {filteredActivities.length === 0 && (
                    <tr><td className="sticky-col" colSpan={1}>No matches</td>{dayArr.map(d=> <td key={d}></td>)}</tr>
                  )}
                  {filteredActivities.map(act => {
                    const stats = computeActivityStats(data.monthlyData, monthKey, act.id, days);
                    return (
                      <tr key={act.id}>
                        <td className="sticky-col">
                          <div className="act-row-main">
                            <div className="act-emoji" style={{'--act-color-soft': act.color+'22'}}>{act.icon}</div>
                            <div className="act-name-wrap">
                              <div className="act-name">{act.name}</div>
                              <div className="act-pct">{stats.percent}% · {stats.checked}/{days} days</div>
                            </div>
                            <div className="act-row-tools">
                              <button className="mini-icon-btn" title="Edit" onClick={()=>setActivityModal({mode:'edit', activity:act})}>✎</button>
                              <button className="mini-icon-btn" title="Delete" onClick={()=>requestDeleteActivity(act)}>🗑</button>
                            </div>
                          </div>
                        </td>
                        {dayArr.map(d => {
                          const checked = isDayChecked(data.monthlyData, monthKey, act.id, d);
                          const isToday = isCurrentActualMonth && d===todayNum;
                          return (
                            <td key={d} className={isToday ? 'today-cell' : ''}>
                              <button
                                className={"chk" + (checked ? ' checked' : '')}
                                style={checked ? {'--chk-color':act.color} : undefined}
                                role="checkbox" aria-checked={checked}
                                aria-label={act.name + ' on day ' + d}
                                onClick={()=>toggleDay(act.id, d)}
                              >{checked ? '✓' : ''}</button>
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="panel">
            <div className="panel-header"><h2 className="panel-title">📈 Progress &amp; trends</h2></div>
            <div className="month-progress-row">
              <span>Monthly completion</span>
              <strong>{monthStats.percent}%</strong>
            </div>
            <ProgressBar percent={monthStats.percent} />
            <div style={{height:20}}></div>
            <div className="charts-grid">
              <div>
                <div className="panel-title" style={{fontSize:13, marginBottom:8}}>Last 7 days</div>
                <div className="weekly-chart">
                  {weeklyChartData.map((d,i)=>(
                    <div className={"wk-bar-wrap" + (d.isToday ? ' is-today':'')} key={i}>
                      <div className="wk-bar" style={{height: Math.max(d.pct,4)+'%'}} title={d.pct+'%'}></div>
                      <div className="wk-bar-label">{d.label}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div>
                <div className="panel-title" style={{fontSize:13, marginBottom:8}}>By task category</div>
                {categoryChartData.length === 0 && <div className="stat-sub">Add tasks to see category progress.</div>}
                {categoryChartData.map(c => (
                  <div className="cat-row" key={c.name}>
                    <div className="cat-row-top">
                      <span className="cname">{c.name}</span>
                      <span className="cfrac">{c.completed}/{c.total}</span>
                    </div>
                    <ProgressBar percent={c.percent} color={c.color} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div>
          <div className="panel">
            <div className="panel-header">
              <h2 className="panel-title">✅ Today's tasks <span className="count-pill">{pendingTasks} open</span></h2>
              <button className="btn btn-primary btn-sm" onClick={()=>setTaskModal({mode:'add'})}>+ Add task</button>
            </div>

            <div className="panel-actions" style={{marginBottom:12, width:'100%'}}>
              <input className="search-input" style={{flex:1}} placeholder="Search tasks" value={taskSearch} onChange={e=>setTaskSearch(e.target.value)} />
              <select className="sort-select" value={taskSort} onChange={e=>setTaskSort(e.target.value)}>
                <option value="dueDate">Sort: Due date</option>
                <option value="priority">Sort: Priority</option>
              </select>
            </div>

            <div className="filter-tabs" style={{marginBottom:12}}>
              {['All','Pending','Completed','Overdue'].map(f => (
                <button key={f} className={"filter-tab" + (taskFilter===f ? ' active':'')} onClick={()=>setTaskFilter(f)}>{f}</button>
              ))}
            </div>

            <div className="task-progress">
              <ProgressBar percent={taskProgressPercent} color="var(--teal)" />
              <span className="task-progress-label">{taskProgressPercent}% {todayTasksOnly.length ? 'of today' : 'overall'}</span>
            </div>

            <div className="task-list">
              {filteredSortedTasks.length === 0 && (
                <div className="empty-state">
                  <span className="es-emoji">🗒️</span>
                  <p>Nothing here yet.</p>
                  <p>Add a task to start planning your day.</p>
                </div>
              )}
              {filteredSortedTasks.map(t => {
                const overdue = !t.completed && t.dueDate < todayStr();
                const prioColor = t.priority==='High' ? 'var(--coral)' : t.priority==='Medium' ? 'var(--amber)' : 'var(--teal)';
                return (
                  <div key={t.id} className={"task-item" + (t.completed ? ' completed':'') + (overdue ? ' overdue':'')} style={{'--prio-color':prioColor}}>
                    <button className={"task-check" + (t.completed ? ' checked':'')} role="checkbox" aria-checked={t.completed} onClick={()=>toggleTask(t.id)}>{t.completed ? '✓':''}</button>
                    <div className="task-body">
                      <div className="task-title-row">
                        <span className="task-title">{t.title}</span>
                      </div>
                      {t.description && <div className="task-desc">{t.description}</div>}
                      <div className="task-meta">
                        <span className={"tag tag-prio-"+t.priority}>{t.priority}</span>
                        <span className={"tag tag-due" + (overdue ? ' is-overdue':'')}>{overdue ? 'Overdue · ' : 'Due '}{t.dueDate}</span>
                        <span className="tag tag-cat">{t.category}</span>
                      </div>
                    </div>
                    <div className="task-tools">
                      <button className="mini-icon-btn" title="Move" onClick={()=>setMoveTaskTarget(t)}>📅</button>
                      <button className="mini-icon-btn" title="Edit" onClick={()=>setTaskModal({mode:'edit', task:t})}>✎</button>
                      <button className="mini-icon-btn" title="Delete" onClick={()=>requestDeleteTask(t)}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={{marginTop:14}}>
              <button className="btn btn-ghost btn-block" onClick={requestClearCompleted}>Clear completed tasks</button>
            </div>
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="year-panel-head">
          <h2 className="panel-title">📅 Year in review</h2>
          <div className="year-nav">
            <button className="icon-btn" onClick={goPrevYear} title="Previous year">←</button>
            <div className="year-label">{reviewYear}</div>
            <button className="icon-btn" onClick={goNextYear} title="Next year">→</button>
          </div>
        </div>

        <div className="year-stats-row">
          <div className="year-stat-chip">Active days<strong>{yearStats.activeDays}</strong></div>
          <div className="year-stat-chip">Average completion<strong>{yearStats.avgPercent}%</strong></div>
          <div className="year-stat-chip">Best month<strong>{yearStats.bestMonthName}</strong></div>
          <div className="year-stat-chip">Longest streak<strong>{data.bestStreak||0} days</strong></div>
        </div>

        <div className="year-grid">
          {Array.from({length:12}).map((_,m) => (
            <MiniMonthHeat
              key={m}
              year={reviewYear}
              monthIndex={m}
              monthlyData={data.monthlyData}
              activities={data.activities}
              isCurrent={isCurrentActualMonth && m===month}
            />
          ))}
        </div>

        <div className="heat-legend">
          Less
          <div className="mini-day" style={{background:'var(--heat-0)'}}></div>
          <div className="mini-day" style={{background:'var(--heat-1)'}}></div>
          <div className="mini-day" style={{background:'var(--heat-2)'}}></div>
          <div className="mini-day" style={{background:'var(--heat-3)'}}></div>
          <div className="mini-day" style={{background:'var(--heat-4)'}}></div>
          More
        </div>
      </div>

      <footer className="app-footer">HabitFlow — data stays on this device, in your browser's local storage.</footer>

      {activityModal && (
        <ActivityModal
          initial={activityModal.mode==='edit' ? activityModal.activity : null}
          existingNames={data.activities.map(a=>a.name)}
          onSave={saveActivity}
          onClose={()=>setActivityModal(null)}
        />
      )}
      {taskModal && (
        <TaskModal
          initial={taskModal.mode==='edit' ? taskModal.task : null}
          categories={categories}
          onSave={saveTask}
          onClose={()=>setTaskModal(null)}
        />
      )}
      {moveTaskTarget && (
        <MoveTaskModal task={moveTaskTarget} onSave={moveTask} onClose={()=>setMoveTaskTarget(null)} />
      )}
      {settingsOpen && (
        <SettingsModal
          theme={data.settings.theme}
          onSetTheme={setTheme}
          onExport={exportData}
          onImport={importData}
          onResetSample={requestResetSample}
          onClearAll={requestClearAll}
          onClose={()=>setSettingsOpen(false)}
        />
      )}
      {confirmState && (
        <ConfirmDialog
          open={true}
          title={confirmState.title}
          message={confirmState.message}
          confirmLabel={confirmState.confirmLabel}
          danger={confirmState.danger}
          onConfirm={confirmState.onConfirm}
          onCancel={()=>setConfirmState(null)}
        />
      )}

      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className={"toast " + t.type}>{t.message}</div>)}
      </div>
      <Confetti burstId={confettiBurst} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
